site_name: Honba Documentation
site_url: https://honba-labs.github.io/honba-docs/
repo_url: https://github.com/honba-labs/honba-docs
repo_name: honba-labs/honba-docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .                 # honba-docs/ root
        - docs              # in case someone writes paths relative to docs/
      check_paths: true
      auto_append: []

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../honba/python/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - First Backtest: getting-started/first-backtest.md
      - Loading Data: getting-started/loading-data.md
  - Strategies:
      - strategies/index.md
      - Writing Strategies: strategies/writing_strategies.md
      - Indicators: strategies/indicators.md
      - Strategy Styles: strategies/strategy_styles.md
      - Portfolio Construction: strategies/portfolio_construction.md
      - Position Management: strategies/position_management.md
  - India:
      - india/index.md
      - Brokers: india/brokers.md
      - Options: india/options.md
      - Mutual Funds: india/mutual_funds.md
      - Universes: india/universes.md
      - Cost Model: india/cost_model.md
      - Market Calendar: india/market_calendar.md
  - AI:
      - ai/index.md
      - Research Loop: ai/research_loop.md
      - RL Training: ai/rl_training.md
      - MCP Gateway: ai/mcp_gateway.md
      - NL Verification: ai/nl_verification.md
  - Backtesting:
      - backtesting/index.md
      - Statistical Validation: backtesting/statistical_validation.md
      - Cost Modeling: backtesting/cost_modeling.md
      - Latency Modeling: backtesting/latency_modeling.md
      - Three-Tier Pipeline: backtesting/three_tier_pipeline.md
  - Tutorials:
      - tutorials/index.md
      - First NIFTY50 Strategy: tutorials/first-nifty50-strategy.md
      - BankNIFTY Options Backtest: tutorials/banknifty-options-backtest.md
      - SIP Backtest: tutorials/sip-backtest.md
      - Alpha30 Factor Model: tutorials/alpha30-factor-model.md
      - Autoresearch Loop: tutorials/autoresearch-loop.md
  - Examples:
      - examples/index.md
  - API:
      - Python: api/python/index.md
      - Python SDK (client): api/python-sdk.md
      - Adapters (typed registry): api/adapters.md
      - REST API and serve: api/rest.md
  - Internals (mdBook): https://honba-labs.github.io/honba/book/
  - Architecture:
      - architecture/index.md
      - Overview: architecture/overview.md
      - Adapter Interface: architecture/adapter_interface.md
      - Money and Currency: architecture/money.md
      - Order Reject and Cancel: architecture/order_reject_cancel.md
      - WASM Indicators: architecture/wasm_indicators.md
      - Runtime (event loop): architecture/event_loop.md
      - Contracts from Rust: architecture/contracts_from_rust.md

