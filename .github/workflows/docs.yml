name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # docs repo checked out at ./honba-docs
      - uses: actions/checkout@v4
        with:
          path: honba-docs

      # sibling checkout so mkdocstrings paths: ../honba/python resolves
      - uses: actions/checkout@v4
        with:
          repository: honba-labs/honba
          path: honba

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: install docs deps
        working-directory: honba-docs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: mkdocs build --strict
        working-directory: honba-docs
        run: mkdocs build --strict

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'

      - name: mdbook build
        working-directory: honba-docs
        run: mdbook build book
